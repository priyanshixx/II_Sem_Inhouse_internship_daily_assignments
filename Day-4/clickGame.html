<!DOCTYPE html>
<html>

<head>
    <style>
        img {
            position: absolute;
        }
    </style>
</head>

<body>
    <div id="startPage">
        <h1>Fruit click game</h1>
        <button onclick="startGame()">Start Game</button>
    </div>
    <div id="gamePage" style="display:none;">
        <h1>let's start!!</h1>
        <p>time left: <span id="timeLeft">20</span></p>
        <p>apple: <span id="apple">0</span></p>
        <p>banana: <span id="banana">0</span></p>
        <img id="fruits" onclick="fruitClicked()" width="100">
         <button id="restartBtn" onclick="restartGame()" style="display:none;">
                🔄 Restart Game
            </button>
    </div>
    <script>
        function fruitClicked() {
            if (currentFruit == "apple") {
                appleCount++;
                document.getElementById("apple").innerHTML = appleCount;
            } else {
                bananaCount++;
                document.getElementById("banana").innerHTML = bananaCount;
            }

            showFruit();
        }
        let appleCount = 0;
        let bananaCount = 0;
        let currentFruit = "";
        function showFruit() {
            let fruit = document.getElementById("fruits");

            let random = Math.floor(Math.random() * 2);

            if (random == 0) {
                fruit.src = "apple.png";
                currentFruit = "apple";
            } else {
                fruit.src = "banana.png";
                currentFruit = "banana";
            }

            moveImage(fruit);
        }
        function moveImage(img) {
            let x = Math.random() * 800;
            let y = Math.random() * 400;
           img.style.left = x + "px";
           img.style.top = y + "px";


        }
        function startTimer() {
            let timeLeft = 20;
            let timer = setInterval(function () {
                document.getElementById("timeLeft").innerHTML = timeLeft;
                timeLeft--;
                if (timeLeft < 0) {
                    clearInterval(timer);
                    alert("game over!")
                    document.getElementById("restartBtn").style.display = "inline-block";
                }
            }, 1000);

        }

        function startGame() {
            document.getElementById("startPage").style.display = "none";
            document.getElementById("gamePage").style.display = "block";
            moveImage(document.getElementById("fruits"));
            showFruit();
            startTimer();
        }
        function restartGame() {

            appleCount = 0;
            bananaCount = 0;

            document.getElementById("apple").innerHTML = 0;
            document.getElementById("banana").innerHTML = 0;
            document.getElementById("timeLeft").innerHTML = 20;

            document.getElementById("fruit").style.display = "block";

            document.getElementById("restartBtn").style.display = "none";

            showFruit();
            startTimer();
        }

    </script>


</body>

</html>
