<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body class="bg-light">

    <div class="container py-5">

        <h2 class="text-center mb-4">Student Records</h2>

        <input type="text" id="search" class="form-control mb-4" placeholder="Search Student">

        <div id="container" class="row g-4"></div>

    </div>

    <script>

        const students = [

            { name: "Mahi", branch: "CSE", cgpa: 8.4 },

            { name: "Manasvi", branch: "Civil", cgpa: 9.0 },

            { name: "Priyanshi", branch: "Design", cgpa: 8.9 },

            { name: "Divyansh", branch: "ECE", cgpa: 7.9 }

        ];

        let html = "";

        students.forEach(student => {

            html += `
        <div class="col-md-4 card-item">

            <div class="card shadow">

                <div class="card-body">

                    <h4>${student.name}</h4>

                    <button class="btn btn-primary btn-sm show-btn">
                        Show Details
                    </button>

                    <div class="details mt-3" style="display:none;">

                        <p><strong>Branch:</strong> ${student.branch}</p>

                        <p><strong>CGPA:</strong> ${student.cgpa}</p>

                    </div>

                </div>

            </div>

        </div>
    `;

        });

        $("#container").html(html);

        /* Show / Hide Details */

        $(document).on("click", ".show-btn", function () {

            let details = $(this).siblings(".details");

            details.slideToggle();

            if ($(this).text() === "Show Details") {

                $(this).text("Hide Details");

            } else {

                $(this).text("Show Details");

            }

        });

        $("#search").on("keyup", function () {

            let value = $(this).val().toLowerCase();

            $(".card-item").each(function () {

                let name = $(this).find("h4").text().toLowerCase();

                if (name.includes(value)) {

                    $(this).show();

                } else {

                    $(this).hide();

                }

            });

        });

    </script>

</body>

</html>
